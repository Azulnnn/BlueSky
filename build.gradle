plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bluesky.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bluesky.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
